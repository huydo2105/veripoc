name: Security toolchain baseline

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  forge:
    name: Foundry build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.9.0
      - name: Toolchain
        run: forge --version
      - name: Build
        run: forge build
      - name: Test
        run: forge test -vvv
      - name: Adapter unit tests
        run: node --test packages/slither-adapter/test.mjs
      - name: API request tests
        run: node --test apps/api/server.test.mjs
      - name: Judge UI state tests
        run: node --test apps/web/state.test.mjs
      - name: Receipt schema and hashing tests
        run: node --test packages/core/receipt.test.mjs

  slither:
    name: Slither static analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.9.0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned analyzer
        run: python -m pip install slither-analyzer==0.11.6
      - name: Run Slither and normalize findings
        run: node packages/slither-adapter/cli.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: slither-report
          path: |
            artifacts/slither.json
            artifacts/call-graph.dot
            artifacts/normalized-slither.json
          if-no-files-found: warn

  worker:
    name: Isolated Foundry fixture worker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Worker controller tests
        run: node --test workers/sandbox/test.mjs workers/sandbox/report.test.mjs
      - name: Build trusted worker image
        run: docker build -f infrastructure/docker/foundry-worker.Dockerfile -t veripoc-foundry-worker:issue-5 .
      - name: Isolation smoke test
        run: bash workers/sandbox/isolation.sh
      - name: Positive and negative vault runs
        run: node workers/sandbox/cli.mjs
      - name: Live API positive and negative jobs
        run: node apps/api/e2e.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-worker-anchors
          path: artifacts/*-anchor.public.json
          if-no-files-found: warn
