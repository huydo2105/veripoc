name: Security toolchain baseline

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  forge:
    name: Foundry build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Toolchain
        run: forge --version
      - name: Build
        run: forge build
      - name: Test
        run: forge test -vvv

  slither:
    name: Slither static analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned analyzer
        run: python -m pip install slither-analyzer==0.11.6
      - name: Run Slither and validate JSON
        run: bash scripts/run-slither.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: slither-report
          path: artifacts/slither.json
          if-no-files-found: warn
